          - paragraph [ref=e42]: About Me
          - paragraph [ref=e45]: I am a doctoral researcher working at the intersection of trustworthy machine learning, natural language processing, and human-centred computing. My research explores how intelligent systems can remain reliable, understandable, and useful in high-impact settings. I am currently advised by Professor R. Sharma and collaborate with the Responsible Computing Lab. Before beginning my doctorate, I worked on applied data-science projects in healthcare and education.
          - blockquote [ref=e46]: “My goal is to build AI systems that people can understand, question, and confidently use.”
