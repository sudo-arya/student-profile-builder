manifest_version: "1.0"
id: ta-krishna-sidebar
name: Krishna Minimal Sidebar
version: "1.0.0"
author: Krishna Bisht
description: Minimal academic portfolio with a sticky identity card and spacious content column.
engine: jinja
entry: index.html.j2
static_directory: static
compatibility:
  profile_schema: ["1.1"]
capabilities:
  profile_photo: true
  research_interests: true
  social_links: true
  markdown_content: true
  theme_switching: true
layout:
  mode: single-page-sidebar
