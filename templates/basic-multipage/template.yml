id: basic-multipage
name: Template 7
version: 1.0.0
author: Student Profile Builder
description: Warm editorial multi-page portfolio with grouped academic content.
engine: external-build
build:
  command: ['{python}', 'build.py']
  output_directory: dist
  data_file: profile-data.json
compatibility:
  profile_schema: ['1.1']
capabilities:
  theme_switching: true
layout:
  mode: multi-page
