id: basic-multipage
name: Basic Multipage
version: 1.0.0
author: Student Profile Builder
description: Reference multi-page academic site with grouped and custom-section pages.
engine: external-build
build:
  command: ['{python}', 'build.py']
  output_directory: dist
  data_file: profile-data.json
compatibility:
  profile_schema: ['1.1']
capabilities:
  theme_switching: false
layout:
  mode: multi-page
