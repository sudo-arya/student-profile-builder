[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-profile-builder"
version = "0.1.0"
description = "Generate static academic profile sites from Markdown"
requires-python = ">=3.11"
dependencies = ["Jinja2>=3.1,<4", "PyYAML>=6.0,<7", "Markdown>=3.6,<4", "bleach>=6.1,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
profile-builder = "profile_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
